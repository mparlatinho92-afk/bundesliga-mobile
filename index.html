<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bundesliga Architect v0.3.40</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --sidebar: #181818; --text: #e0e0e0; --border: #333; 
            --c-fix-up: #4caf50; --c-var-up: #8bc34a; --c-fix-down: #f44336; --c-var-down: #ff9800;
            --bg-fix-up: rgba(0, 100, 0, 0.3); --bg-var-up: rgba(50, 205, 50, 0.15); 
            --bg-fix-down: rgba(139, 0, 0, 0.3); --bg-var-down: rgba(255, 140, 0, 0.25);
            --bg-cl: rgba(0, 0, 255, 0.2); --c-cl: #448aff;
            --bg-el: rgba(255, 165, 0, 0.2); --c-el: #ffca28;
            --bg-ecl: rgba(0, 128, 0, 0.2); --c-ecl: #66bb6a;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        #league-list { flex: 1; overflow-y: auto; min-height: 0; }
        .league-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #222; font-size: 14px; }
        .league-item.active { background: #2a2a2a; color: #fff; border-left: 4px solid var(--c-fix-up); }
        .league-level { font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-right: 4px; color: #000; }
        .league-id { font-size: 10px; opacity: 0.5; margin-right: 6px; }
        .league-logo-mini { width: 16px; height: 16px; object-fit: contain; vertical-align: middle; margin-right: 5px; flex-shrink: 0; }
        #league-title img { height: 30px; width: auto; object-fit: contain; vertical-align: middle; margin-right: 10px; }
        
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        header { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: var(--panel); flex-shrink: 0; }
        .controls { display: flex; align-items: center; gap: 10px; }
        
        #content { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #252525; position: sticky; top: 0; z-index: 10; }
        
        tr.row-cl { background: var(--bg-cl); } tr.row-el { background: var(--bg-el); } tr.row-ecl { background: var(--bg-ecl); }
        tr.row-fix-up { background-color: var(--bg-fix-up); } tr.row-var-up { background-color: var(--bg-var-up); }
        tr.row-fix-down { background-color: var(--bg-fix-down); } tr.row-var-down { background-color: var(--bg-var-down); }
        
        .btn { padding: 8px 12px; background: var(--c-fix-up); color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-info { background: #2196f3; }
        .btn-hist { background: #444; width: 30px; padding: 5px; }
        .btn:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); width: 85%; max-width: 1000px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #222; }
        .tab { padding: 15px 20px; cursor: pointer; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--c-var-up); background: var(--panel); }
        
        .relegation-card { background: #333; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid gold; display:flex; justify-content:space-between; align-items:center; }
        .stat-table th { background: #222; }
        .stat-table td { border-bottom: 1px solid #333; padding: 8px; }

        .pokal-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 14px; background: #1a1a1a; color: #fff; display: flex; align-items: center; gap: 8px; }
        .pokal-item.active { background: #2a2a2a; border-left: 4px solid #d32f2f; }
        .pokal-item:hover { background: #222; }
        .pokal-badge { background: #d32f2f; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 7px; border-radius: 8px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .pokal-tab-btn { padding: 10px 16px; border: none; cursor: pointer; background: #1e1e1e; color: #ccc; font-size: 13px; border-bottom: 3px solid transparent; transition: background 0.15s; }
        .pokal-tab-btn:hover { background: #2a2a2a; }
        .pokal-tab-btn.active { background: #252525; color: #fff; border-bottom-color: #d32f2f; }
        .pokal-tab-btn:disabled { opacity: 0.35; cursor: default; }
        .pokal-matches { width: 100%; max-width: 860px; }
        .pokal-match { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; gap: 8px; min-height: 44px; }
        .pm-team { flex: 1; font-size: 13px; line-height: 1.35; }
        .pm-home { text-align: right; }
        .pm-team.winner { font-weight: bold; }
        .pm-team.loser { opacity: 0.38; }
        .pm-liga { font-size: 11px; opacity: 0.4; font-weight: normal; display: block; }
        .pm-score { flex: 0 0 54px; text-align: center; font-size: 15px; font-weight: bold; white-space: nowrap; }
        .pm-header { display: flex; gap: 8px; padding: 6px 0; font-size: 11px; font-weight: bold; opacity: 0.45; border-bottom: 2px solid #333; }
        .pm-header .pm-home { flex: 1; } .pm-header .pm-score { flex: 0 0 54px; } .pm-header .pm-away { flex: 1; }

        /* ── Mobile Drawer ── */
        #sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 199; }
        #sidebar-overlay.visible { display: block; }
        #btn-menu { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; }

        @media (max-width: 768px) {
            body { height: 100dvh; }
            #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-260px); transition: transform 0.28s ease; }
            #sidebar.open { transform: translateX(0); }
            #btn-menu { display: block; }
            header { flex-direction: column; align-items: stretch; height: auto; padding: 8px 10px; gap: 6px; }
            #league-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
            .controls { flex-wrap: wrap; justify-content: flex-start; gap: 6px; padding-bottom: 2px; }
            .btn { font-size: 12px; padding: 6px 10px; }
            #content { overflow-x: auto; padding: 0 0 60px 8px; }
            table { font-size: 11px; min-width: 0; width: 100%; }
            th, td { padding: 6px 5px; }
            table th:nth-child(8), table td:nth-child(8),
            table th:nth-child(10), table td:nth-child(10) { display: none; }
            table td:nth-child(2) { overflow: hidden; word-break: break-word; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding:20px; font-weight:bold; border-bottom:1px solid #333;">Bundesliga Architect</div>
    <div id="league-list"></div>
</div>
<div id="sidebar-overlay"></div>

<div id="main">
    <header>
        <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0;">
            <button id="btn-menu" aria-label="Menü">☰</button>
            <h2 id="league-title">Lade...</h2>
        </div>
        <div class="controls">
            <button class="btn btn-hist" onclick="App.prevSeason()">&lt;</button>
            <span id="season-info" style="font-weight:bold;">Saison 2025/26</span>
            <button class="btn btn-hist" onclick="App.nextSeasonView()">&gt;</button>
            <div style="width:1px; height:20px; background:#444; margin:0 10px;"></div>
            <span id="version-display" style="font-size:11px; opacity:0.4; margin-right:4px;"></span>
            <button class="btn btn-info" onclick="App.showChangelog()">📋 Changelog</button>
            <button class="btn btn-info" onclick="App.showRules()">ℹ️ Regeln</button>
            <button id="btn-play" class="btn" onclick="App.nextStep()">Woche</button>
            <button id="btn-sim" class="btn" onclick="App.simRest()">Simulieren</button>
            <button id="btn-finish" class="btn" onclick="App.showSeasonEnd()">Abschluss</button>
            <button id="btn-mega" class="btn" style="background:#6a1b9a;" onclick="App.megaSim()">⚡ Multi-Saison</button>
            <button class="btn btn-info" onclick="App.showDebugLog()">🔍 Log</button>
            <button class="btn" style="background:#d32f2f;" onclick="App.reset()">Reset</button>
        </div>
    </header>
    <div id="content"></div>
</div>

<div id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-title">Info</span>
            <button class="btn" onclick="document.getElementById('modal').style.display='none'">Schließen</button>
        </div>
        <div class="tabs" id="modal-tabs" style="display:none;">
            <div class="tab active" onclick="App.switchTab('rele')">Relegation</div>
            <div class="tab" onclick="App.switchTab('log')">Transfers</div>
            <div class="tab" onclick="App.switchTab('stats')">Ligagrößen</div>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script src="game_data.js"></script>
<script src="game_engine.js"></script>

    };
    const leagueLogo = id => { const f = LEAGUE_LOGOS[id]; return f ? `Wappen/Ligen- und Verbandswappen/${f}` : null; };
    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('version-display');
        if (el) el.textContent = 'v' + VERSION;
    });
    const App = {
        activeLeague: null,
        viewHistoryOffset: null,
        tableView: 'gesamt',
        pokalTab: 0,

        init: function() {
            if(!Engine.init()) return;
            this.renderSidebar();
            const first = Object.keys(Engine.leagues).sort((a,b) => Engine.leagues[a].level - Engine.leagues[b].level)[0];
            this.loadLeague(first);
            this.updateStatus();
        },

        updateStatus: function() {
            const label = this.viewHistoryOffset !== null
                ? (Engine.history[this.viewHistoryOffset]?.year || '?')
                : Engine.getFormattedSeason();

            let status = label;
            if(this.viewHistoryOffset === null) {
                const md = Engine.currentMatchday;
                const tot = Engine.totalMatchdays;
                const leagueTot = Engine.leagues[this.activeLeague]?.seasonLength || tot;
                status += ` | Tag ${md}/${leagueTot}`;
                const finished = md >= tot;
                document.getElementById('btn-play').disabled = finished;
                document.getElementById('btn-sim').disabled = finished;
                document.getElementById('btn-finish').disabled = false;
                document.getElementById('btn-finish').style.opacity = finished ? 1 : 0.5;
                document.getElementById('btn-mega').disabled = false;
            } else {
                status += " (Archiv)";
                document.getElementById('btn-play').disabled = true;
                document.getElementById('btn-sim').disabled = true;
                document.getElementById('btn-finish').disabled = true;
                document.getElementById('btn-mega').disabled = true;
            }
            document.getElementById('season-info').innerText = status;
        },

        prevSeason: function() {
            if (this.viewHistoryOffset === null) {
                if (Engine.history.length > 0) this.viewHistoryOffset = Engine.history.length - 1;
                else return;
            } else if (this.viewHistoryOffset > 0) {
                this.viewHistoryOffset--;
            } else return;
            if (this.activeLeague === '__pokal__') this.showPokal();
            else this.loadLeague(this.activeLeague);
            this.updateStatus();
        },

        nextSeasonView: function() {
            if (this.viewHistoryOffset === null) return;
            if (this.viewHistoryOffset < Engine.history.length - 1) {
                this.viewHistoryOffset++;
            } else {
                this.viewHistoryOffset = null;
            }
            if (this.activeLeague === '__pokal__') this.showPokal();
            else this.loadLeague(this.activeLeague);
            this.updateStatus();
        },

            const LEVEL_COLORS = ['#FFD700','#FF8C00','#FF4500','#CC2255','#9922AA','#5544DD','#2277FF','#00AACC'];
            const parseId = id => id.split('-').map(Number);
            const sorted = Object.values(Engine.leagues).sort((a,b) => {
                const pa = parseId(a.id), pb = parseId(b.id);
                for(let i=0;i<Math.max(pa.length,pb.length);i++){
                    const d=(pa[i]||0)-(pb[i]||0);
                    if(d) return d;
                }
                return 0;
            });
            let prevLevel = null;
            sorted.forEach(l => {
                if(prevLevel !== null && l.level !== prevLevel) {
                    const sep = document.createElement('div');
                    sep.style.cssText = 'border-top:1px solid #fff;margin:0;opacity:0.25;';
                    list.appendChild(sep);
                }
                prevLevel = l.level;
                const div = document.createElement('div');
                div.className = `league-item ${this.activeLeague === l.id ? 'active' : ''}`;
                const c = LEVEL_COLORS[(l.level-1) % LEVEL_COLORS.length];
                const logo = leagueLogo(l.id);
                const logoHtml = logo ? `<img src="${logo}" class="league-logo-mini">` : '';
                div.innerHTML = `<span class="league-level" style="background:${c}">${l.level}</span><span class="league-id">(${l.id})</span>${logoHtml} ${l.name}`;
                div.onclick = () => this.loadLeague(l.id);
                list.appendChild(div);
            });
        },

            if (!pokal) {
                document.getElementById('content').innerHTML = '<div style="padding:20px;opacity:0.5;">Kein Pokal aktiv. Starte eine neue Saison via Reset.</div>';
                return;
            }
            const pThumb = t => t?.thumb || GAME_DATA.teams[t?.id]?.thumb || '';
            const pImg = (t, size) => { const s = pThumb(t); return s ? `<img src="${s}" width="${size}" height="${size}" style="vertical-align:middle;margin-right:4px;flex-shrink:0;">` : ''; };
            const pLiga = t => Engine.leagues[t?.leagueId]?.name || '';
            const teilnehmerBtn = `<button onclick="App.switchPokalTab(-1)" class="pokal-tab-btn${this.pokalTab === -1 ? ' active' : ''}">Teilnehmerfeld</button>`;
            const tabsHtml = teilnehmerBtn + pokal.rounds.map((r, i) => {
                const disabled = !r.played && !r.matches.length;
                return `<button onclick="App.switchPokalTab(${i})" class="pokal-tab-btn${this.pokalTab === i ? ' active' : ''}"${disabled ? ' disabled' : ''}>${r.name}</button>`;
            }).join('');
            let matchHtml = '';
            if (this.pokalTab === -1) {
                // Teilnehmerfeld: alle Teams aus 1. Runde, gruppiert nach Liga
                const allIds = [];
                (pokal.rounds[0]?.matches || []).forEach(m => { allIds.push(m.hId, m.aId); });
                const byLeague = {};
                allIds.forEach(id => {
                    const t = Engine.teams[id] || GAME_DATA.teams[id];
                    const lid = t?.leagueId || '?';
                    if (!byLeague[lid]) byLeague[lid] = [];
                    byLeague[lid].push({ id, t });
                });
                // Vorsaison-Tabelle für Sortierung innerhalb jeder Liga
                const prevHistIdx = this.viewHistoryOffset !== null ? this.viewHistoryOffset - 1 : Engine.history.length - 1;
                const prevTeams = Engine.history[prevHistIdx]?.teams || {};
                const prevRank = id => prevTeams[id]?.rank ?? 999;
                const ligaOrder = Object.keys(byLeague).sort((a, b) => {
                    const la = Engine.leagues[a]?.level ?? 99, lb = Engine.leagues[b]?.level ?? 99;
                    return la - lb;
                });
                matchHtml = '<div style="display:flex;flex-wrap:wrap;gap:20px;padding:4px;">';
                ligaOrder.forEach(lid => {
                    const ligaName = Engine.leagues[lid]?.name || lid;
                    const entries = byLeague[lid].sort((a, b) => prevRank(a.id) - prevRank(b.id));
                    matchHtml += `<div style="min-width:220px;flex:1;">
                        <div style="font-size:11px;font-weight:bold;opacity:0.5;letter-spacing:1px;padding:8px 0 6px;border-bottom:1px solid #333;margin-bottom:4px;">${ligaName} <span style="opacity:0.5;">(${entries.length})</span></div>`;
                    entries.forEach(({ id, t }, idx) => {
                        const rank = prevRank(id);
                        const rankStr = rank < 999 ? `<span style="font-size:11px;opacity:0.35;width:18px;display:inline-block;">${rank}.</span>` : '';
                        matchHtml += `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;">${rankStr}${pImg(t, 18)}${t?.name || id}</div>`;
                    });
                    matchHtml += '</div>';
                });
                matchHtml += '</div>';
            } else {

                if (!round || (!round.played && !round.matches.length)) {
                    matchHtml = '<div style="padding:20px;opacity:0.5;">Diese Runde wurde noch nicht gespielt.</div>';

                    matchHtml = '<div class="pokal-matches"><div class="pm-header"><span class="pm-home">Heim</span><span class="pm-score"></span><span class="pm-away">Auswärts</span></div>';
                    round.matches.forEach(m => {
                        const h = Engine.teams[m.hId], a = Engine.teams[m.aId];
                        const hWon = m.winnerId === m.hId, aWon = m.winnerId === m.aId;
                        const hCls = round.played ? (hWon ? 'winner' : 'loser') : '';
                        const aCls = round.played ? (aWon ? 'winner' : 'loser') : '';
                        const score = round.played ? `${m.hGoals} : ${m.aGoals}` : '– : –';

                            <div class="pm-team pm-home ${hCls}">${pImg(h,18)}${h?.name || m.hId}<span class="pm-liga">${pLiga(h)}</span></div>

                            <div class="pm-team pm-away ${aCls}">${pImg(a,18)}${a?.name || m.aId}<span class="pm-liga">${pLiga(a)}</span></div>

        },

        switchPokalTab: function(i) { this.pokalTab = i; this.showPokal(); },

        renderPokalBracket: function(pokal) {
            const MATCH_H = 62, R1 = 32;
            const CONTAINER_H = R1 * (MATCH_H + 6);
            const bThumb = t => t?.thumb || GAME_DATA.teams[t?.id]?.thumb || '';
            const bImg = t => { const s = bThumb(t); return s ? `<img src="${s}" width="13" height="13" style="vertical-align:middle;margin-right:2px;flex-shrink:0;">` : ''; };
            const lShort = lid => (Engine.leagues[lid]?.name || '').replace('1. Bundesliga','1.BL').replace('2. Bundesliga','2.BL').replace('3. Liga','3.Liga').replace('Regionalliga','RL').replace('Oberliga','OL').replace('liga','L.').replace('Liga','L.');
            let html = `<div style="display:flex;gap:6px;overflow-x:auto;height:${CONTAINER_H}px;padding-bottom:8px;">`;
            pokal.rounds.forEach((round, ri) => {
                const n = Math.pow(2, 5 - ri);
                const spacing = CONTAINER_H / n;
                html += `<div style="flex:0 0 230px;position:relative;height:${CONTAINER_H}px;">`;
                html += `<div style="position:absolute;top:0;left:0;right:0;text-align:center;font-size:10px;opacity:0.45;padding:2px 0;">${round.name}</div>`;
                for (let i = 0; i < n; i++) {
                    const top = Math.round(i * spacing + (spacing - MATCH_H) / 2);
                    const m = round.matches[i];
                    const h = m ? Engine.teams[m.hId] : null;
                    const a = m ? Engine.teams[m.aId] : null;
                    const played = round.played;
                    const hWon = played && m?.winnerId === m?.hId;
                    const aWon = played && m?.winnerId === m?.aId;
                    const borderCol = played ? '#4caf50' : (m ? '#444' : '#2a2a2a');
                    const teamRow = (t, won, goals) => {
                        const nameStyle = won ? 'font-weight:bold;color:#4caf50;' : played ? 'opacity:0.38;' : '';
                        const score = played && goals !== null ? ` <b>${goals}</b>` : '';
                        const league = t ? lShort(t.leagueId) : '';
                        return `<div style="display:flex;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;">
                            ${bImg(t)}<span style="font-size:10px;overflow:hidden;text-overflow:ellipsis;${nameStyle}">${t?.name || (m ? '?' : '')}${score}</span>
                        </div>
                        <div style="font-size:9px;opacity:0.32;padding-left:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${league}</div>`;
                    };
                    html += `<div style="position:absolute;top:${top}px;left:2px;right:2px;height:${MATCH_H}px;background:#202020;border-radius:3px;border-left:2px solid ${borderCol};padding:4px 5px;box-sizing:border-box;overflow:hidden;">`;
                    html += teamRow(h, hWon, m?.hGoals ?? null);
                    html += `<div style="height:4px;"></div>`;
                    html += teamRow(a, aWon, m?.aGoals ?? null);
                    html += '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
            return html;
        },

        loadLeague: function(lid) {
            this.activeLeague = lid;
            this.renderSidebar();
            const l = Engine.leagues[lid];
            const logo = leagueLogo(lid);
            document.getElementById('league-title').innerHTML = (logo ? `<img src="${logo}">` : '') + l.name;
            
            let teamData = Engine.teams;
            if (this.viewHistoryOffset !== null && Engine.history[this.viewHistoryOffset]) {
                teamData = Engine.history[this.viewHistoryOffset].teams;
            }

            const teams = Object.values(teamData).filter(t => t.leagueId === lid);
            // NOTFALL-SORTIERUNG FALLS RANG FEHLT (Bayern nach oben, Daleiden nach unten)
            teams.sort((a,b) => (a.rank||99) - (b.rank||99) || (b.strength||0) - (a.strength||0));

            const dayResults = this.viewHistoryOffset === null
                ? (Engine.matchdayResults || []).filter(r => r.leagueId === lid)
                : [];
            let html = '';
            if (dayResults.length > 0) {
                html += `<div style="padding:8px 15px 6px; background:#1a1a1a; border-bottom:1px solid #333; font-size:13px;">
                    <span style="opacity:0.5; margin-right:10px;">Spieltag ${Engine.currentMatchday}</span>
                    ${dayResults.map(r => {
                        const hw = r.score1 > r.score2, aw = r.score2 > r.score1;
                        return `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;margin-bottom:2px;">
                            <span style="color:${hw?'#4caf50':aw?'#f44336':'#ccc'}">${r.home}</span>
                            <b>${r.score1}:${r.score2}</b>
                            <span style="color:${aw?'#4caf50':hw?'#f44336':'#ccc'}">${r.away}</span>
                        </span>`;
                    }).join('')}
                </div>`;
            }
            const tv = this.tableView;
            const btn = (v, label) => `<button onclick="App.setTableView('${v}')" class="btn" style="padding:4px 12px;font-size:12px;background:${tv===v?'#555':'#333'};margin-right:4px;">${label}</button>`;
            html += `<div style="padding:6px 15px;background:#1a1a1a;border-bottom:1px solid #333;">
                ${btn('gesamt','Gesamt')}${btn('heim','Heim')}${btn('auswaerts','Auswärts')}
            </div>`;
            html += `<table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp.</th><th>G.</th><th>U.</th><th>V.</th><th>Tore</th><th>Diff.</th><th>Pkt.</th><th></th></tr></thead><tbody>`;

            let fixUp=0, varUp=0, fixDown=0, varDown=0;
            const count = teams.length;
            const overflow = count - l.target;

            if (l.level === 1) { fixDown=2; varDown=1; }
            else if (l.level === 2) { fixUp=2; varUp=1; fixDown=2; varDown=1; }
            else if (l.level === 3) { fixUp=2; varUp=1; fixDown=4; }
            else if (l.level === 4) {
                const info = Engine.getPromotionInfo();
                if(info.direct.some(n => l.name.includes(n))) fixUp=1; else varUp=1;
                fixDown=3; if(overflow>0) varDown=overflow;
            }
            else if (l.level > 4 && Engine.DOWN_MAP[l.id]) { fixUp=1; fixDown=3; if(overflow>0) varDown=overflow; }

            // Für Heim/Auswärts: neu sortieren (nur Display, t.rank bleibt für Logik)
            let displayTeams = [...teams];
            if (tv !== 'gesamt') {
                displayTeams.sort((a, b) => {
                    const sa = (tv==='heim' ? a.homeStats : a.awayStats) || {pts:0,gf:0,ga:0};
                    const sb = (tv==='heim' ? b.homeStats : b.awayStats) || {pts:0,gf:0,ga:0};
                    if (sb.pts !== sa.pts) return sb.pts - sa.pts;
                    const da = sa.gf-sa.ga, db = sb.gf-sb.ga;
                    if (db !== da) return db - da;
                    return sb.gf - sa.gf;
                });
            }

            let displayRank = 1;
            displayTeams.forEach((t, i) => {
                const rank = t.rank; // echte Logikposition für Zonen
                if (i > 0) {
                    const p = displayTeams[i-1];
                    const ps = (tv==='heim' ? p.homeStats : tv==='auswaerts' ? p.awayStats : p.stats) || p.stats;
                    const ts = (tv==='heim' ? t.homeStats : tv==='auswaerts' ? t.awayStats : t.stats) || t.stats;
                    const tied = ts.pts === ps.pts &&
                        (ts.gf - ts.ga) === (ps.gf - ps.ga) &&
                        ts.gf === ps.gf;
                    if (!tied) displayRank = i + 1;
                }
                const s = (tv==='heim' ? t.homeStats : tv==='auswaerts' ? t.awayStats : t.stats) || t.stats;
                const revRank = count - teams.indexOf(t); // revRank nach Gesamtrang
                let rowClass = "", infoText = "";

                if (l.level === 1) {
                    if(rank <= 4) { rowClass = "row-cl"; infoText = "Champions League"; }
                    else if(rank === 5) { rowClass = "row-el"; infoText = "Europa League"; }
                    else if(rank === 6) { rowClass = "row-ecl"; infoText = "Conference League"; }
                }

                if (l.level > 1) {
                    if (rank <= fixUp) {
                        rowClass = "row-fix-up";
                        infoText = l.level === 4 ? "▲ Direktaufstieg" : "▲ Aufstieg";
                    } else if (rank <= fixUp + varUp) {
                        rowClass = "row-var-up";
                        infoText = l.level === 3 ? "⇄ Rele 2.BL" : l.level === 4 ? "⇄ Playoff" : "⇄ Relegation";
                    }
                }

                if (revRank <= fixDown) { rowClass = "row-fix-down"; infoText = "▼ Abstieg"; }
                else if (revRank <= fixDown + varDown) { rowClass = "row-var-down"; infoText = "▼ Variabler Abstieg"; }

                html += `<tr class="${tv==='gesamt' ? rowClass : ''}">
                    <td style="text-align:center;font-weight:bold;">${displayRank}.</td>
                    <td style="display:flex;align-items:center;gap:10px;">
                        ${(t.thumb || GAME_DATA.teams[t.id]?.thumb) ? `<img src="${t.thumb || GAME_DATA.teams[t.id].thumb}" width="24">` : ''}
                        ${t.name} <span style="font-size:11px;opacity:0.45;">${t.strength != null ? `(${t.strength})` : ''}</span>
                    </td>
                    <td>${s.p}</td>
                    <td>${s.w}</td>
                    <td>${s.d}</td>
                    <td>${s.l}</td>
                    <td>${s.gf}:${s.ga}</td>
                    <td>${s.gf - s.ga}</td>
                    <td><b>${s.pts}</b></td>
                    <td style="font-size:12px;opacity:0.7;">${tv==='gesamt' ? infoText : ''}</td>
                </tr>`;
            });
            html += "</tbody></table>";
            document.getElementById('content').innerHTML = html;
        },

            else { alert("Saisonende erreicht."); }

                                                        <div>&#8226; FIX: Nordost wurde in Jahr 0 fälschlich als Direktaufsteiger gewertet (Substring-Bug)</div>
                            <div class="font-bold text-slate-400">v0.1.4</div>
                                                        <div>&#8226; FIX: localStorage voll nach vielen Saisons - History auf 10 Eintraege und Minimaldaten beschraenkt</div>
                            <div class="font-bold text-slate-400">v0.1.3</div>
                                                        <div>&#8226; FIX: Level 4->3 Aufstiege funktionierten nie - findTarget gab null zurueck bei nationalen Ligen</div>
                                                        <div>&#8226; FIX: Relegation-Tab zeigte immer leer - resetSeason loeschte Ergebnisse vor dem Return</div>
                            <div class="font-bold text-slate-400">v0.1.2</div>
                                                        <div>&#8226; NEU: Mindestgroessen-Schutz (3.Liga>=20, Regionalliga>=16, Oberliga>=14) - Ligen schrumpfen nicht mehr unbegrenzt</div>
                                                        <div>&#8226; NEU: Relegation-Modal zeigt alle 5 Regionalliga-Ergebnisse (Direktaufsteiger + Playoff)</div>
                                                        <div>&#8226; FIX: Relegation-Tab war immer leer - Tab-Reihenfolge korrigiert</div>
                                                        <div>&#8226; NEU: Ligatabellen: Direktaufstieg vs. Playoff korrekt beschriftet</div>
                </div>
            `;
            this.openModal('Changelog', html);
        },

        exportSeasonReport: function() {
            const report = this._lastReport;
            if(!report) return;
            const season = Engine.getFormattedSeason();
            const data = { season: season, migrations: report.migrations, stats: report.stats, relegation: report.relegation };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `saison-${season.replace('/', '-')}-bericht.json`;
            a.click();
        },

        showRules: function() {
            const info = Engine.getPromotionInfo();
            const html = `<h3>Aufstiegsregelung zur 3. Liga (Jahr ${info.year+1}/3)</h3>
                <p><b>Direkt:</b> ${info.direct.join(", ")}</p>
                <p><b>Relegation:</b> ${info.playoff.join(" vs ")}</p>`;
            this.openModal("Regelwerk", html, false);
        },

        showSeasonEnd: function() {
            if(Engine.currentMatchday < Engine.totalMatchdays) {
                if(!confirm("Saison nicht beendet. Trotzdem abschließen?")) return;
            }
            const res = Engine.processSeasonTransition();
            
            let releHtml = "";
            res.relegation.forEach(r => {
                releHtml += `<div class="relegation-card" style="border-left-color:${r.color||'gold'}">
                    <div>${r.match}</div> <div style="font-size:20px;font-weight:bold;">${r.result}</div>
                    <div>Sieger: ${r.winner}</div>
                </div>`;
            });

            let logHtml = "";
            res.migrations.sort((a,b) => (a.sortId||"").localeCompare(b.sortId||""));
            res.migrations.forEach(m => {
                let color='#fff', icon='•';
                if(m.type.includes('up')) { color='var(--c-fix-up)'; icon='▲'; }
                if(m.type.includes('down')) { color='var(--c-fix-down)'; icon='▼'; }
                if(m.type==='down_var') { color='var(--c-var-down)'; icon='▼'; }
                if(m.type.includes('rele')) { color='#00bcd4'; icon='⇄'; }
                logHtml += `<div style="padding:5px; border-bottom:1px solid #333; display:flex; justify-content:space-between;">
                    <div><span style="color:${color};margin-right:10px;">${icon}</span> <b>${m.team}</b></div>
                    <div style="color:#888;font-size:11px;">${m.from} &#10142; ${m.to}</div>
                </div>`;
            });

            this._lastReport = res;
            let statsHtml = "<div style='text-align:right;margin-bottom:8px;'><button class='btn btn-info' onclick='App.exportSeasonReport()'>⬇ JSON Export</button></div><table class='stat-table' style='width:100%'><tr><th>Liga</th><th>Soll</th><th>Neu</th><th>Diff</th></tr>";
            Object.values(res.stats).forEach(s => {
                const diff = s.new - s.target;
                const col = diff === 0 ? 'green' : 'orange';
                statsHtml += `<tr><td>${s.name}</td><td>${s.target}</td><td style="color:${col}">${s.new}</td><td>${diff>0?'+'+diff:diff}</td></tr>`;
            });
            statsHtml += "</table>";

            document.getElementById('modal-tabs').style.display = 'flex';
            document.getElementById('modal-body').innerHTML = `
                <div id="view-rele">${releHtml}</div>
                <div id="view-log" style="display:none;">${logHtml}</div>
                <div id="view-stats" style="display:none;">${statsHtml}</div>
            `;
            this.openModal("Saisonabschlussbericht", null, true);
            this.updateStatus();
            this.loadLeague(this.activeLeague);
        },

        switchTab: function(tab) {
            ['rele','log','stats'].forEach(t => document.getElementById('view-'+t).style.display = 'none');
            document.getElementById('view-'+tab).style.display = 'block';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        },

        openModal: function(title, content, showTabs) {
            document.getElementById('modal-title').innerText = title;
            if(content) document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-tabs').style.display = showTabs ? 'flex' : 'none';
            document.getElementById('modal').style.display = 'flex';
        },

        setTableView: function(v) { this.tableView = v; this.loadLeague(this.activeLeague); },

        megaSim: function() {
            const n = parseInt(prompt("Wie viele Saisons simulieren?", "10"));
            if (!n || n < 1 || n > 500) return;
            let done = 0, stopped = false;
            for (let i = 0; i < n; i++) {
                try {
                    Engine.simulateFullSeason();
                    const pre = Engine.sanityCheck();
                    if (pre.length) Engine.log('warn', `Pre-Transition S${i+1}: ${pre.join(' | ')}`);
                    Engine.processSeasonTransition();
                    const post = Engine.sanityCheck();
                    if (post.length) { Engine.log('error', `Post-Transition S${i+1}: ${post.join(' | ')}`); stopped = true; break; }
                    done++;
                } catch(e) {
                    Engine.log('error', `Exception S${i+1}: ${e.message}`);
                    stopped = true; break;
                }
            }
            this.renderSidebar();
            this.loadLeague(this.activeLeague);
            this.updateStatus();
            alert(stopped ? `⚠ Abbruch nach ${done} Saisons — siehe Log für Details.` : `✓ ${done} Saisons simuliert.`);
        },

        showDebugLog: function() {
            const colors = { info:'#888', warn:'#ff9800', error:'#f44336' };
            const entries = Engine.debugLog.slice().reverse();
            const html = entries.length === 0
                ? '<p style="opacity:0.5;padding:20px;">Noch keine Einträge.</p>'
                : '<div style="font-family:monospace;font-size:12px;">' +
                  entries.map(e =>
                    `<div style="padding:4px 0;border-bottom:1px solid #2a2a2a;">` +
                    `<span style="color:#444;margin-right:8px;">${e.t}</span>` +
                    `<span style="color:#666;margin-right:8px;">${e.season}</span>` +
                    `<span style="color:${colors[e.type]||'#888'};font-weight:bold;margin-right:8px;">[${e.type.toUpperCase()}]</span>` +
                    `${e.msg}</div>`
                  ).join('') + '</div>';
            this.openModal('Debug Log',
                `<button class="btn" style="margin-bottom:10px;" onclick="Engine.debugLog=[];App.showDebugLog()">🗑 Leeren</button>${html}`,
                false);
        },

        startNextSeason: function() { location.reload(); },
        reset: function() { if(confirm("Reset?")) { localStorage.clear(); location.reload(); } }
    };

    window.onload = function() { App.init(); };

    // Mobile sidebar drawer + touch swipe
    (function() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const btnMenu = document.getElementById('btn-menu');
        function open()  { sidebar.classList.add('open');    overlay.classList.add('visible'); }
        function close() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); }
        btnMenu.addEventListener('click', () => sidebar.classList.contains('open') ? close() : open());
        overlay.addEventListener('click', close);
        document.getElementById('league-list').addEventListener('click', () => { if (window.innerWidth <= 768) close(); });
        let sx = 0, sy = 0;
        document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - sx;
            const dy = Math.abs(e.changedTouches[0].clientY - sy);
            if (dy > Math.abs(dx) || Math.abs(dx) < 50) return;
            if (dx > 50 && sx < 50) open();
            if (dx < -50 && sidebar.classList.contains('open')) close();
        }, { passive: true });
    })();
</script>
</body>
</html>
