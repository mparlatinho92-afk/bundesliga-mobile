<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bundesliga Mobile v0.8.92</title>
    <!-- Homescreen-Icon / PWA (Android + iOS) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bundesliga">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --sidebar: #181818; --text: #e0e0e0; --border: #333; 
            --c-fix-up: #4caf50; --c-var-up: #8bc34a; --c-fix-down: #f44336; --c-var-down: #ff9800;
            --bg-fix-up: rgba(0, 100, 0, 0.3); --bg-var-up: rgba(50, 205, 50, 0.15); 
            --bg-fix-down: rgba(139, 0, 0, 0.3); --bg-var-down: rgba(255, 140, 0, 0.25);
            --bg-cl: rgba(0, 0, 255, 0.2); --c-cl: #448aff;
            --bg-el: rgba(255, 165, 0, 0.2); --c-el: #ffca28;
            --bg-ecl: rgba(0, 128, 0, 0.2); --c-ecl: #66bb6a;
            --bracket-bg: #202020; --bracket-bd: #444; --bracket-bd-empty: #2a2a2a; --c-win: #4caf50; --muted: #9a9a9a;
            --panel-2: #1a1a1a; --panel-3: #111; --c-link: #66aaff; --c-gold: #ffd700;
            --win-box-bg: #2a1a00; --chip-bg: #252540; --row-cur-bg: #1a2a1a; --hover-bg: #1e2a3a;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; position: relative; flex-shrink: 0; }
        /* Drag-Griff: Sidebar-Breite frei ziehbar (Maus + Touch via Pointer-Events); zentrierte Greif-Pille */
        #sidebar-resizer { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; z-index: 6; touch-action: none; }
        #sidebar-resizer::before { content: ''; position: absolute; top: 50%; right: 1px; transform: translateY(-50%); width: 3px; height: 46px; border-radius: 3px; background: var(--border); opacity: 0.85; transition: background 0.15s, opacity 0.15s; }
        #sidebar-resizer:hover::before, #sidebar-resizer:active::before { background: var(--c-fix-up); opacity: 1; }
        #sidebar-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; font-weight: bold; border-bottom: 1px solid #333; flex-shrink: 0; }
        #sidebar-hd > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #sidebar-hd > div { flex-shrink: 0; }
        .sbhd-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px 4px; opacity: 0.7; color: var(--text); }
        .sbhd-btn:hover { opacity: 1; }
        #league-list { flex: 1; overflow-y: auto; min-height: 0; }
        .league-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #222; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .league-item.active { background: #2a2a2a; color: #fff; border-left: 4px solid var(--c-fix-up); }
        /* Fusioniertes Liga-Badge: Farbe = Level, Text = volle Liga-ID; eng um den Text (max. Platz für Namen) */
        .league-level { display: inline-block; font-size: 10px; font-weight: bold; padding: 2px 3px; border-radius: 3px; margin-right: 5px; color: #000; vertical-align: middle; flex-shrink: 0; }
        /* Feste Box wie Tabellen-Wappen (40x32) → einheitliche Footprint, Namen buendig (kicker/fussball.de-Harmonie) */
        .league-logo-mini { display: inline-block; width: 30px; height: 24px; object-fit: contain; vertical-align: middle; margin-right: 6px; flex-shrink: 0; }
        /* Vereinswappen in Tabellen (Excel-Logik): Wappen = eigene Spalte (td.wpc),
           danach Mannschaft-Spalte -> "Mannschaft"-Header steht ueber den Namen,
           Vereinsnamen buendig. EINHEITLICHE feste Box (40x32, object-fit:contain):
           breite Wappen werden eingepasst statt die Spalte zu sprengen (keine
           dominanten Einzelwappen / "Pandora"). */
        img.wp   { width: 40px; height: 32px; object-fit: contain; vertical-align: middle; }
        img.wp-s { width: 38px; height: 24px; object-fit: contain; object-position: center; vertical-align: middle; flex-shrink: 0; }
        td.wpc { width: 1%; white-space: nowrap; padding: 3px 6px; text-align: center; }
        td.tm  { padding-left: 6px; }
        #league-title { margin: 0; min-width: 0; flex: 1 1 auto; font-size: clamp(15px, 2.2vw, 20px); display: flex; align-items: center; overflow: hidden; }
        #league-title img { height: 30px; width: auto; object-fit: contain; margin-right: 10px; flex-shrink: 0; }
        .lt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        header { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; justify-content: space-between; background: var(--panel); flex-shrink: 0; }
        .controls { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .hdr-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
        .hdr-spacer { flex: 1 1 0; min-width: 0; }
        #action-bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: nowrap; }
        #action-bar > .btn { order: 0; flex: 1 1 auto; }
        #action-bar #gs-wrap { order: 1; flex: 0 1 300px; min-width: 160px; }
        #action-bar #gs-pill { width: 100%; }
        #action-bar #gs-input-wrap { width: 100%; }
        #action-bar #gs-input { width: 100%; }
        #spicker { display: none; position: fixed; z-index: 6000; background: #1e1e2e; border: 1px solid #555; border-radius: 6px; min-width: 140px; max-height: 280px; overflow-y: auto; box-shadow: 0 4px 12px #0006; }
        .picker-active { background: #2a4a6a !important; color: #90caf9; }
        body.light #spicker { background: #fff; border-color: #bbb; color: #1a1a1a; }
        body.light .picker-active { background: #dde6f0 !important; color: #1565c0; }
        #dots-wrap { position: relative; flex: 0 0 auto; }
        #dots-btn { font-size: 15px; padding: 5px 11px; letter-spacing: 1px; }
        #dots-menu { display: none; position: absolute; top: 36px; right: 0; z-index: 5000; background: #1e1e2e; border: 1px solid #555; border-radius: 6px; min-width: 180px; box-shadow: 0 4px 12px #0006; overflow: hidden; }
        .dots-item { padding: 9px 14px; cursor: pointer; font-size: 13px; }
        .dots-item:hover { background: #2a2a3a; }
        .dots-item.dots-danger { color: #f88; }

        /* Action-Modus: Settings-Modal + Spielfrei-Banner */
        .act-master { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 2px 0 8px; cursor: pointer; }
        .act-sub { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
        .act-depth { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
        .act-depth > span { font-size: 13px; opacity: 0.7; }
        .act-depth .btn { padding: 4px 12px; font-size: 12px; background: var(--panel-3); }
        .act-depth .btn.act-depth-on { background: var(--c-fix-up); color: #000; font-weight: bold; }
        .act-quick { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
        .act-quick .btn { padding: 4px 10px; font-size: 12px; }
        .act-list { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; height: 240px; overflow-y: auto; border-top: 1px solid var(--border); }
        /* Drag-Griff: Liga-Liste in der Höhe frei ziehbar (Mittelweg ein-/ausgeklappt), Maus + Touch */
        .act-list-resizer { height: 16px; cursor: row-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
        .act-list-resizer::before { content: ''; width: 46px; height: 3px; border-radius: 3px; background: var(--border); transition: background 0.15s; }
        .act-list-resizer:hover::before, .act-list-resizer:active::before { background: var(--c-fix-up); }
        .act-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; border-bottom: 1px solid var(--panel-2); }
        .act-row input { width: 16px; height: 16px; flex-shrink: 0; }
        .act-badge { display: inline-block; min-width: 26px; text-align: center; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 3px; color: #000; flex-shrink: 0; }
        .act-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .act-banner { background: var(--chip-bg); color: var(--muted); font-size: 12px; padding: 7px 15px; border-bottom: 1px solid var(--border); }
        
        #content { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #252525; position: sticky; top: 0; z-index: 10; }
        
        tr.row-cl { background: var(--bg-cl); } tr.row-el { background: var(--bg-el); } tr.row-ecl { background: var(--bg-ecl); }
        tr.row-fix-up { background-color: var(--bg-fix-up); } tr.row-var-up { background-color: var(--bg-var-up); }
        tr.row-fix-down { background-color: var(--bg-fix-down); } tr.row-var-down { background-color: var(--bg-var-down); }
        /* Live-Tabelle (Action-Modus): provisorischer Stand, klar als solcher erkennbar */
        .lvt-note { padding: 5px 15px; font-size: 12px; color: var(--c-var-up); background: var(--row-cur-bg); border-bottom: 1px solid var(--border); }
        .lvt-up { color: var(--c-fix-up); font-size: 10px; font-weight: bold; margin-left: 3px; }
        .lvt-dn { color: var(--c-fix-down); font-size: 10px; font-weight: bold; margin-left: 3px; }
        /* Score-Chip der laufenden Partie (Flashscore-Optik), Stand aus Sicht der Mannschaft:
           grün = führt, gelb = unentschieden, rot = liegt zurück.
           Sitzt rechtsbündig am Ende der Namensspalte → alle Chips fluchten untereinander, mit
           Abstand vor der Sp-Spalte. Absolut positioniert: kein Einfluss auf den Textfluss, und
           vertikal mittig (ein Float säße am oberen Zeilenrand). _fitTeamNames rechnet die Breite
           trotzdem mit (getBoundingClientRect über alle Kind-Elemente) und kürzt den Namen rechtzeitig. */
        .ltab td.tm, .lvt-tab td.lvt-tm { position: relative; }
        .lvt-sc { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); z-index: 1;
                  min-width: 26px; padding: 1px 4px; border-radius: 3px;
                  font-size: 10px; font-weight: 700; line-height: 1.4; text-align: center; }
        .lvt-sc.win { background: #2e9b4a; color: #fff; }
        .lvt-sc.drw { background: #e2b007; color: #1a1a1a; }
        .lvt-sc.los { background: #d33a2f; color: #fff; }
        /* Sp/Diff/Pkt rot, solange die Partie läuft – die Zahlen sind noch in Bewegung */
        td.lvt-num { color: var(--c-fix-down); font-weight: 600; }
        .lvt-tab td.lvt-num { color: var(--c-fix-down); }
        /* Konferenz-Spalte */
        .conf-live { background: #121226; padding: 6px 10px; border-top: 1px solid #333; }
        .lvt-tabs { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
        .lvt-tb { background: #1e1e2e; color: #bbb; border: 1px solid #444; border-radius: 4px; font-size: 10px; padding: 3px 6px; cursor: pointer; }
        .lvt-tb.on { background: #2a4a6a; color: #fff; border-color: #4a7aaa; }
        .lvt-tab { width: 100%; border-collapse: collapse; font-size: 11px; }
        .lvt-tab th { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; text-align: left; padding: 2px 3px; border-bottom: 1px solid #333; }
        .lvt-tab td { padding: 3px; border-bottom: 1px solid #222; }
        .lvt-tab td.c, .lvt-tab th.c { text-align: center; }
        .lvt-pl { white-space: nowrap; width: 1%; opacity: 0.75; }
        .lvt-tm { max-width: 0; width: 99%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* Overlay-Tabelle hat kein _fitTeamNames → Platz fürs Chip freihalten, damit der Name
           davor per Ellipsis endet statt darunter zu laufen (nur in Zeilen mit laufendem Spiel) */
        .lvt-tab td.lvt-tm-live { padding-right: 38px; }
        /* Mini-Wappen links des Namens – kleiner als .res-wp (18px), die Overlay-Zeilen sind eng.
           Leerer Span als Platzhalter, damit Namen ohne Wappen bündig bleiben. */
        .lvt-wp { display: inline-block; width: 14px; height: 14px; object-fit: contain; vertical-align: middle; margin-right: 4px; flex-shrink: 0; }
        /* Tor: Zeile des Torschützen leuchtet kurz auf (Neu-Render alle ~1s → 3s sichtbar) */
        @keyframes lvtGoal { from { box-shadow: inset 0 0 0 100px rgba(76,175,80,0.38); } to { box-shadow: inset 0 0 0 100px transparent; } }
        .lvt-tab tr.lvt-goal td { animation: lvtGoal 0.9s ease-out; }
        /* Vereinsnamen auf der Karte: erst ab Zoomstufe 9, mit weißem Halo damit sie über
           jedem Untergrund lesbar bleiben. Platzierung/Auswahl macht _mapUpdateLabels. */
        .map-lbl { font-size: 10px; font-weight: 600; color: #1a1a1a; white-space: nowrap;
                   text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
                   pointer-events: none; }
        .map-lbl-miss { color: #c50019; }
        .lvt-tab tr.lvt-play { font-weight: bold; }

        /* Standings: Statspalten zentriert & kompakt (behebt Lücke Diff↔Pkt) */
        .ltab th.c, .ltab td.c { text-align: center; padding-left: 5px; padding-right: 5px; white-space: nowrap; }
        /* Namensspalte: clippt bei Breiten-Zwang (Mobil ODER manuell gezogen) → _fitTeamNames misst Überlauf
           (scrollWidth>clientWidth) und schaltet auf Kurznamen. Ohne Zwang (Desktop) wächst die Zelle → voller Name. */
        .ltab td.tm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* Spalten-Resize: jeder Kopf hat einen Griff am rechten Rand (Maus+Touch); Doppelklick = Standard */
        .ltab th.colh { position: sticky; top: 0; }
        .ltab th .colrz { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; touch-action: none; z-index: 11; }
        .ltab th .colrz::before { content: ''; position: absolute; top: 20%; right: 2px; width: 2px; height: 60%; background: var(--border); opacity: 0; transition: opacity 0.15s, background 0.15s; }
        .ltab th .colrz:hover::before, .ltab th .colrz:active::before { opacity: 1; background: var(--c-fix-up); }
        /* Form-Ampel (letzte 5, aktuellstes zuerst) */
        .frm { display: inline-flex; gap: 2px; align-items: center; }
        .fdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .fdot-cur { box-shadow: 0 0 0 1.5px var(--text); }
        /* Auf-/Abstiegs-Info: voller Zielname (Desktop) – Pfeil-Kürzel .iarr nur mobil */
        .ltab .iarr { display: none; font-weight: bold; }
        /* Ergebnis-Liste oben: untereinander, Mini-Wappen */
        .reslist { display: flex; flex-direction: column; gap: 1px; }
        .res-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
        .res-h { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .res-a { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; }
        .res-h > span, .res-a > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .res-sc { flex: 0 0 auto; min-width: 40px; text-align: center; }
        .res-wp { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; display: inline-block; }
        /* Spieltags-Schlagzeile unter jedem Ergebnis (data_reports.js) – einzeilig, schrumpfbar */
        .res-item { padding: 1px 0; }
        .res-line { font-size: 11px; font-style: italic; color: var(--muted); line-height: 1.25; padding: 0 4px 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* Spiel des Tages: nur Hintergrund-Tönung + goldene Schrift (kein Label/Stern – der Report selbst markiert es) */
        .res-item-feat { background: rgba(255,215,0,0.10); border-radius: 4px; padding: 2px 5px; }
        .res-item-feat .prev-row { opacity: 1; } /* Vorschau: Spiel des Tages nicht gedimmt */
        .res-line-feat { color: var(--c-gold); font-style: normal; font-weight: 600; }
        /* Pressestimmen (Paket 4): Trainer-Zitate unterm Spiel des Tages – umbrechend (kein nowrap wie .res-line) */
        .res-press { font-size: 11px; font-style: italic; color: var(--muted); line-height: 1.35; padding: 1px 4px 2px; }
        .res-press b { font-style: normal; font-weight: 600; }
        /* Serien-Texte (Paket 6): Lauf-/Krisen-Zeilen unter der Ergebnisliste – umbrechend */
        .res-streaks { padding: 2px 15px 8px; font-size: 11px; color: var(--muted); line-height: 1.45; }
        /* Live-Konferenz: neue Ergebnisse + bewegte Tabellen-Teams blitzen dezent auf (einmalig, ~0,7s) */
        @keyframes flashRes { from { background: rgba(76,175,80,0.30); } to { background: transparent; } }
        .res-new { animation: flashRes 0.7s ease-out; border-radius: 4px; }
        @keyframes flashUp   { from { box-shadow: inset 0 0 0 100px rgba(76,175,80,0.22); } to { box-shadow: inset 0 0 0 100px transparent; } }
        @keyframes flashDown { from { box-shadow: inset 0 0 0 100px rgba(244,67,54,0.18); } to { box-shadow: inset 0 0 0 100px transparent; } }
        .ltab tr.rank-up   td { animation: flashUp   0.8s ease-out; }
        .ltab tr.rank-down td { animation: flashDown 0.8s ease-out; }
        @media (prefers-reduced-motion: reduce) { .res-new, .ltab tr.rank-up td, .ltab tr.rank-down td, .lvt-tab tr.lvt-goal td { animation: none; } }
        /* Vorschau (noch nicht gespielt): gedimmt, „–:–" */
        .prev-row { opacity: 0.6; }
        .prev-row .res-sc { font-weight: normal; opacity: 0.7; }
        /* Spiel-Feed (Ergebnisse + Vorschau): höhenverstellbar – Mittelding zwischen eingeklappt und alles sichtbar */
        .md-feed { overflow-y: auto; }
        .md-feed-resizer { height: 14px; cursor: row-resize; display: flex; align-items: center; justify-content: center; touch-action: none; background: var(--panel-2); border-bottom: 1px solid var(--border); }
        .md-feed-resizer::before { content: ''; width: 46px; height: 3px; border-radius: 3px; background: var(--border); transition: background 0.15s; }
        .md-feed-resizer:hover::before, .md-feed-resizer:active::before { background: var(--c-fix-up); }
        
        .btn { padding: 8px 12px; background: var(--c-fix-up); color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-info { background: #2196f3; }
        .btn-hist { background: #444; width: 30px; padding: 5px; }
        /* Undo-Pfeil: destruktiv (löscht Spieltag) → Warn-Farbe, abgesetzt vom Ansicht-Cluster */
        #btn-undo { background: var(--c-var-down); color: #000; font-weight: bold; margin-right: 6px; }
        #btn-undo:hover { background: #ffb74d; }
        #btn-undo:disabled { background: #444; color: var(--text); }
        .btn:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); width: 85%; max-width: 1000px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #222; }
        .tab { padding: 15px 20px; cursor: pointer; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--c-var-up); background: var(--panel); }
        
        .relegation-card { background: #333; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid gold; display:flex; justify-content:space-between; align-items:center; }
        .stat-table th { background: #222; }
        .stat-table td { border-bottom: 1px solid #333; padding: 8px; }

        .pokal-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 14px; background: #1a1a1a; color: #fff; display: flex; align-items: center; gap: 8px; }
        .pokal-item.active { background: #2a2a2a; border-left: 4px solid #d32f2f; }
        .pokal-item:hover { background: #222; }
        .pokal-badge { background: #d32f2f; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 7px; border-radius: 8px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .pokal-tab-btn { padding: 10px 16px; border: none; cursor: pointer; background: #1e1e1e; color: #ccc; font-size: 13px; border-bottom: 3px solid transparent; transition: background 0.15s; }
        .pokal-tab-btn:hover { background: #2a2a2a; }

        /* Touch-Geräte IMMER Mobil-Layout (pointer:coarse) – verhindert versehentliche Desktop-Ansicht im PWA, auch im Hochformat. Maus/Desktop (fine) bleibt Desktop. */
        @media (max-width: 768px), (pointer: coarse) {
            body { height: 100dvh; }

            #map-saison button { padding: 7px 12px; font-size: 12px; }

            header { height: auto; min-height: 52px; padding: 4px 10px; flex-wrap: wrap; row-gap: 4px; }

            .controls { gap: 3px; }

            #btn-changelog { display: none; }
            .hdr-sep { display: none; }
            #dots-btn { font-size: 13px; padding: 3px 7px; letter-spacing: 0; }
            #action-bar { flex-wrap: wrap; gap: 6px; padding: 6px 10px; }
            .btn { font-size: 12px; padding: 6px 10px; }
            #content { overflow-x: auto; padding: 0 0 16px 8px; }
            table { font-size: 11px; min-width: 0; width: 100%; }
            th, td { padding: 6px 4px; }
            /* Standings mobil: kleinere Schrift, alle Stats + Form bleiben; Info-Spalte (12) bleibt, aber kompakt (nur Pfeil/CL) */
            table.ltab { font-size: 10.5px; }
            table.ltab th, table.ltab td { padding: 6px 2px; }
            table.ltab th.c, table.ltab td.c { padding-left: 3px; padding-right: 3px; }
            table.ltab td.tm, table.ltab th:nth-child(3) { max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .ltab .itxt { display: none; }     /* voller Zielname aus */
            .ltab .iarr { display: inline; }    /* Pfeil ▲▼ / CL bleibt */
            .ltab td.inf, .ltab th:nth-child(12) { text-align: center; padding: 6px 2px; }
            /* Stat-Ansichten mobil: Rangliste/Bilanz unter die Liste stapeln statt schmale Spalten zu quetschen */
            .statcols { display: block; }
            .statcols-side { width: auto; border-left: none; border-top: 1px solid var(--border); }
            .fdot { width: 7px; height: 7px; }
            .pokal-teiln-liga { min-width: calc(50% - 8px); flex: 0 0 calc(50% - 8px); }
            /* Pokal-Schlagzeile mobil: etwas mehr Luft, Text bricht über die volle Breite */
            .pm-wrap { padding: 0 5px; }
            .pm-line { font-size: 10.5px; line-height: 1.4; padding: 1px 0 7px; }
        }
        /* Schmale Phones: G/U/V weg (nach Wichtigkeit) – Sp/Tore/Diff/Pkt/Form/Info bleiben */
        @media (max-width: 360px) {
            table.ltab th:nth-child(5), table.ltab td:nth-child(5),
            table.ltab th:nth-child(6), table.ltab td:nth-child(6),
            table.ltab th:nth-child(7), table.ltab td:nth-child(7) { display: none; }
            table.ltab td.tm, table.ltab th:nth-child(3) { max-width: 130px; }
        }
        /* Mini-Phones: zusätzlich Tore weg */
        @media (max-width: 320px) {
            table.ltab th:nth-child(8), table.ltab td:nth-child(8) { display: none; }
        }
        /* ── Light Mode ── */
        body.light {
            --bg: #f0f0f0; --panel: #ffffff; --sidebar: #e8e8e8; --text: #1a1a1a; --border: #cccccc;
            --bg-fix-up: rgba(0,100,0,0.12); --bg-var-up: rgba(50,205,50,0.1);
            --bg-fix-down: rgba(139,0,0,0.1); --bg-var-down: rgba(255,140,0,0.12);

            --bracket-bg: #f4f4f4; --bracket-bd: #bbb; --bracket-bd-empty: #ddd; --c-win: #2e7d32; --muted: #5a5a5a;

        }

        body.light .pokal-item.active { background: #dde6f0; }
        body.light .pokal-tab-btn { background: #e8e8e8; color: #444; }

        body.light .pokal-tab-btn.active { background: #fff; color: #000; }
        body.light .pokal-tabs { background: #ebebeb; border-bottom-color: #ccc; }

        body.light .pm-header { border-bottom-color: #ccc; opacity: 0.7; }

        body.light .pm-toggle { background: #ebebeb; border-color: #d0d0d0; }
        /* Ausgeschiedene Vereine: im Light-Theme ist opacity:0.38 unlesbar → kräftigere Dämpfung via Farbe */
        body.light .pm-team.loser { opacity: 1; color: #7a7a7a; }
        body.light .pm-team.loser .pm-liga { color: #9a9a9a; }

        body.light .btn-hist { background: #bbb; color: #333; }
        body.light #sidebar-hd { border-bottom-color: #ccc; }
        body.light #action-bar { border-bottom-color: #ccc; }
        body.light #dots-menu { background: #fff; border-color: #bbb; color: #1a1a1a; }
        body.light .dots-item:hover { background: #f0f0f0; }
        body.light #gs-pill { background: #ececec; border-color: #bbb; }
        body.light #gs-input { color: #1a1a1a; }

        #save-bar { background: var(--panel); border-top: 1px solid var(--border); padding: 0 12px 6px; flex-shrink: 0; }
        #save-bar-hd { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; cursor: pointer; font-size: 11px; color: #777; user-select: none; }
        #save-bar-hd:hover { color: #aaa; }
        body.light #save-bar-hd { color: #999; }
        body.light #save-bar-hd:hover { color: #555; }
        #save-bar.collapsed .save-action-grid, #save-bar.collapsed #saveStatus { display: none; }
        #save-bar .btn { font-size: 11px; padding: 5px 8px; }

        @media (min-width: 1024px) { .save-action-grid { grid-template-columns: repeat(7, 1fr); } }

        /* Karten-Overlay ist IMMER dunkel → Theme-Variablen lokal auf Dark fixieren (sonst schwarz-auf-schwarz im Light-Theme) */
        #map-overlay { color: #e0e0e0; --text:#e0e0e0; --muted:#9a9a9a; --panel-2:#1a1a1a; --panel-3:#111; --border:#444; }
        /* ── Live-Konferenz (depth 4) – immer dunkel, Vollbild ── */
        #conf-overlay { position: fixed; inset: 0; z-index: 9100; background: #0f1020; color: #e0e0e0; display: flex; flex-direction: column; }
        #conf-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #16182e; border-bottom: 1px solid #333; flex-wrap: wrap; flex-shrink: 0; }

        .conf-st { flex: 0 0 50px; text-align: right; }

        .conf-kick { color: #888; font-size: 11px; } .conf-ft { color: #777; font-size: 11px; }
        .conf-ticker { background: #121226; padding: 6px 12px; border-top: 1px solid #333; }

        .conf-row { cursor: pointer; } .conf-row:hover { background: rgba(255,255,255,0.03); }

        .conf-row.conf-fav { background: rgba(240,192,64,0.10); }

        .conf-star.on { background: var(--c-gold); color: #000; font-weight: bold; border-color: var(--c-gold); }
        /* Konferenz breit: drei Spalten (Spiele · Ticker · Live-Tabelle). Schmal/mobil bleibt

        @media (min-width: 760px) { #conf-body { flex-direction: row; } .conf-matches { flex: 1 1 44%; overflow-y: auto; } .conf-ticker { flex: 0 0 28%; border-top: none; border-left: 1px solid #333; overflow-y: auto; } .conf-live { flex: 0 0 28%; border-top: none; border-left: 1px solid #333; overflow-y: auto; } }

        /* Pull-to-Refresh-Indikator (Touchscreen-Geste) */
        #ptr-indicator { position: fixed; top: 0; left: 50%; margin-top: -48px; z-index: 9500;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;

            transform: translateX(-50%) translateY(0); }

        #ptr-spinner { font-size: 22px; line-height: 1; color: var(--c-fix-up); transition: transform .15s ease; }
        #ptr-indicator.ready #ptr-spinner { transform: scale(1.15); opacity: 0.6; }

        #ptr-indicator.armed { background: var(--c-fix-up); border-color: var(--c-fix-up); }

<div id="sidebar">

        <button id="btn-saison" class="btn" onclick="App._seasonAction()">Saison</button>
        <button id="btn-mega" class="btn" style="background:#6a1b9a;" onclick="App.megaSim()">⚡ Multi-Saison</button>
        <div id="gs-wrap">
            <div id="gs-pill" onclick="App._gsOpen()">
                <span id="gs-icon">🔍</span>
                <div id="gs-input-wrap">
                    <input id="gs-input" type="text" placeholder="Liga oder Verein…" autocomplete="off"
                        oninput="App._gsShow()" onfocus="App._gsShow()" onclick="event.stopPropagation()"
                        onkeydown="if(event.key==='Escape')App._gsClose()">
                </div>
            </div>
            <div id="gs-list" onclick="event.stopPropagation()"></div>
        </div>
    </div>
    <div id="spicker"></div>
    <div id="content"></div>
    <div id="save-bar">
        <div id="save-bar-hd" onclick="App._saveBarToggle()">
            <span>Aktionen</span>
            <span id="savebar-toggle-lbl">▴</span>
        </div>
        <div class="save-action-grid">
            <button onclick="App.exportGameState()" class="btn" style="background:#10b981;">💾 Exportieren</button>
            <button onclick="document.getElementById('importFileInput').click()" class="btn" style="background:#a855f7;">📂 Importieren</button>
            <button onclick="App.quickSave()" class="btn" style="background:#f59e0b;color:#000;">⚡ Quick-Save</button>
            <button onclick="App.restoreAutoSave()" class="btn" style="background:#ea580c;">↩️ Auto-Save</button>
            <button onclick="App.openResetCenter()" class="btn" style="background:#dc2626;">🔧 Reset-Center</button>
            <button onclick="App.showLeagueSizes()" class="btn" style="background:#0ea5e9;">⚖️ Liga-Größen</button>
            <button onclick="App.showGeoCheck()" class="btn" style="background:#14b8a6;">🧭 Geo-Check</button>
            <button onclick="App.showTagCheck()" class="btn" style="background:#0d9488;">🏷️ Tag-Report</button>
            <button onclick="App.openDatasetManager()" class="btn" style="background:#64748b;">📂 Datensätze</button>
            <button onclick="document.getElementById('vpPlanFileInput').click()" class="btn" style="background:#7c3aed;">🛡 VP-Plan</button>
            <button onclick="App.clearVerbandspokalPlan()" class="btn" style="background:#4c1d95;font-size:11px;">✕ VP-Plan</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="App.importGameState(event)">
        <input type="file" id="vpPlanFileInput" accept=".json,application/json" style="display:none;" onchange="App.importVerbandspokalPlan(event)">
        <div id="saveStatus"></div>
    </div>
</div>

<div id="modal">

    </div>
</div>

        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8" selected>8</option>
