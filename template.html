<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bundesliga Architect v0.3.74</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --sidebar: #181818; --text: #e0e0e0; --border: #333; 
            --c-fix-up: #4caf50; --c-var-up: #8bc34a; --c-fix-down: #f44336; --c-var-down: #ff9800;
            --bg-fix-up: rgba(0, 100, 0, 0.3); --bg-var-up: rgba(50, 205, 50, 0.15); 
            --bg-fix-down: rgba(139, 0, 0, 0.3); --bg-var-down: rgba(255, 140, 0, 0.25);
            --bg-cl: rgba(0, 0, 255, 0.2); --c-cl: #448aff;
            --bg-el: rgba(255, 165, 0, 0.2); --c-el: #ffca28;
            --bg-ecl: rgba(0, 128, 0, 0.2); --c-ecl: #66bb6a;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        #league-list { flex: 1; overflow-y: auto; min-height: 0; }
        .league-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #222; font-size: 14px; }
        .league-item.active { background: #2a2a2a; color: #fff; border-left: 4px solid var(--c-fix-up); }
        .league-level { font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-right: 4px; color: #000; }
        .league-id { font-size: 10px; opacity: 0.5; margin-right: 6px; }
        .league-logo-mini { height: 24px; width: auto; max-width: 44px; object-fit: contain; vertical-align: middle; margin-right: 5px; flex-shrink: 0; }
        #league-title img { height: 30px; width: auto; object-fit: contain; vertical-align: middle; margin-right: 10px; }
        
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        header { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: var(--panel); flex-shrink: 0; }
        .controls { display: flex; align-items: center; gap: 10px; }
        
        #content { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #252525; position: sticky; top: 0; z-index: 10; }
        
        tr.row-cl { background: var(--bg-cl); } tr.row-el { background: var(--bg-el); } tr.row-ecl { background: var(--bg-ecl); }
        tr.row-fix-up { background-color: var(--bg-fix-up); } tr.row-var-up { background-color: var(--bg-var-up); }
        tr.row-fix-down { background-color: var(--bg-fix-down); } tr.row-var-down { background-color: var(--bg-var-down); }
        
        .btn { padding: 8px 12px; background: var(--c-fix-up); color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-info { background: #2196f3; }
        .btn-hist { background: #444; width: 30px; padding: 5px; }
        .btn:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); width: 85%; max-width: 1000px; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #222; }
        .tab { padding: 15px 20px; cursor: pointer; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--c-var-up); background: var(--panel); }
        
        .relegation-card { background: #333; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid gold; display:flex; justify-content:space-between; align-items:center; }
        .stat-table th { background: #222; }
        .stat-table td { border-bottom: 1px solid #333; padding: 8px; }

        .pokal-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #2a2a2a; font-size: 14px; background: #1a1a1a; color: #fff; display: flex; align-items: center; gap: 8px; }
        .pokal-item.active { background: #2a2a2a; border-left: 4px solid #d32f2f; }
        .pokal-item:hover { background: #222; }
        .pokal-badge { background: #d32f2f; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 7px; border-radius: 8px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .pokal-tab-btn { padding: 10px 16px; border: none; cursor: pointer; background: #1e1e1e; color: #ccc; font-size: 13px; border-bottom: 3px solid transparent; transition: background 0.15s; }
        .pokal-tab-btn:hover { background: #2a2a2a; }
        .pokal-tab-btn.active { background: #252525; color: #fff; border-bottom-color: #d32f2f; }
        .pokal-tab-btn:disabled { opacity: 0.35; cursor: default; }
        .pokal-matches { width: 100%; max-width: 860px; }
        .pokal-match { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; gap: 8px; min-height: 44px; }
        .pm-team { flex: 1; font-size: 13px; line-height: 1.35; }
        .pm-home { text-align: right; }
        .pm-team.winner { font-weight: bold; }
        .pm-team.loser { opacity: 0.38; }
        .pm-liga { font-size: 11px; opacity: 0.4; font-weight: normal; display: block; }
        .pm-score { flex: 0 0 54px; text-align: center; font-size: 15px; font-weight: bold; white-space: nowrap; }
        .pm-header { display: flex; gap: 8px; padding: 6px 0; font-size: 11px; font-weight: bold; opacity: 0.45; border-bottom: 2px solid #333; }
        .pm-header .pm-home { flex: 1; } .pm-header .pm-score { flex: 0 0 54px; } .pm-header .pm-away { flex: 1; }
        .pokal-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #333; overflow-x: auto; scrollbar-width: none; }
        .pokal-tabs::-webkit-scrollbar { display: none; }
        .pm-status { padding: 8px 16px; font-size: 11px; color: #aaa; background: #1e1e1e; border-bottom: 1px solid #2a2a2a; }
        .pm-toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; background: #1e1e1e; border-bottom: 1px solid #2a2a2a; }
        .pm-toggle span:first-child { font-size: 13px; font-weight: bold; }
        .pm-toggle-arrow { font-size: 11px; opacity: 0.5; transition: transform 0.2s; display: inline-block; }
        .pm-toggle-arrow.open { transform: rotate(180deg); }
        .pokal-teiln { display: flex; flex-wrap: wrap; gap: 16px; padding: 4px; }
        .pokal-teiln-liga { min-width: 200px; flex: 1; }

        /* ── Mobile Drawer ── */
        #sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 199; }
        #sidebar-overlay.visible { display: block; }
        #btn-menu { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; }

        @media (max-width: 768px) {
            body { height: 100dvh; }
            #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-260px); transition: transform 0.28s ease; }
            #sidebar.open { transform: translateX(0); }
            #btn-menu { display: block; }
            header { flex-direction: column; align-items: stretch; height: auto; padding: 8px 10px; gap: 6px; }
            #league-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
            .controls { flex-wrap: wrap; justify-content: flex-start; gap: 6px; padding-bottom: 2px; }
            .btn { font-size: 12px; padding: 6px 10px; }
            #content { overflow-x: auto; padding: 0 0 16px 8px; }
            table { font-size: 11px; min-width: 0; width: 100%; }
            th, td { padding: 6px 5px; }
            table th:nth-child(8), table td:nth-child(8),
            table th:nth-child(10), table td:nth-child(10) { display: none; }
            table td:nth-child(2) { overflow: hidden; word-break: break-word; }
            .pokal-teiln-liga { min-width: calc(50% - 8px); flex: 0 0 calc(50% - 8px); }
        }
        /* ── Light Mode ── */
        body.light {
            --bg: #f0f0f0; --panel: #ffffff; --sidebar: #e8e8e8; --text: #1a1a1a; --border: #cccccc;
            --bg-fix-up: rgba(0,100,0,0.12); --bg-var-up: rgba(50,205,50,0.1);
            --bg-fix-down: rgba(139,0,0,0.1); --bg-var-down: rgba(255,140,0,0.12);
            --bg-cl: rgba(0,0,255,0.08); --c-cl: #1565c0;
            --bg-el: rgba(200,120,0,0.1); --c-el: #e65100;
            --bg-ecl: rgba(0,100,0,0.1); --c-ecl: #2e7d32;
        }
        body.light th { background: #e4e4e4; color: #1a1a1a; }
        body.light .tabs { background: #e0e0e0; }
        body.light .tab { color: #444; }
        body.light .tab.active { background: #fff; }
        body.light .stat-table th { background: #e4e4e4; }
        body.light .stat-table td { border-bottom: 1px solid #ccc; }
        body.light .league-item { border-bottom: 1px solid #d0d0d0; color: #1a1a1a; }
        body.light .league-item.active { background: #dde6f0; color: #000; }
        body.light .relegation-card { background: #e8e8e8; }
        body.light .pokal-item { background: #f0f0f0; color: #1a1a1a; border-bottom-color: #d0d0d0; }
        body.light .pokal-item:hover { background: #e4e4e4; }
        body.light .pokal-item.active { background: #dde6f0; }
        body.light .pokal-tab-btn { background: #e8e8e8; color: #444; }
        body.light .pokal-tab-btn:hover { background: #ddd; }
        body.light .pokal-tab-btn.active { background: #fff; color: #000; }
        body.light .pokal-tabs { background: #ebebeb; border-bottom-color: #ccc; }
        body.light .pokal-match { border-bottom-color: #d0d0d0; }
        body.light .pm-header { border-bottom-color: #ccc; opacity: 0.7; }
        body.light .pm-status { background: #ebebeb; color: #555; border-color: #d0d0d0; }
        body.light .pm-toggle { background: #ebebeb; border-color: #d0d0d0; }
        body.light .btn-hist { background: #bbb; color: #333; }
        body.light .btn:disabled { background: #bbb; }
        body.light #modal { background: rgba(0,0,0,0.4); }

        #save-bar { background: var(--panel); border-top: 1px solid var(--border); padding: 8px 20px; flex-shrink: 0; }
        .save-action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        @media (min-width: 768px) { .save-action-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .save-action-grid { grid-template-columns: repeat(6, 1fr); } }
        #saveStatus { text-align: center; margin-top: 5px; font-size: 0.82rem; color: #94a3b8; min-height: 1.1em; }
        body.light #saveStatus { color: #64748b; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding:20px; font-weight:bold; border-bottom:1px solid #333;">Bundesliga Architect</div>
    <div id="league-list"></div>
</div>
<div id="sidebar-overlay"></div>

<div id="main">
    <header>
        <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0;">
            <button id="btn-menu" aria-label="Menü">☰</button>
            <h2 id="league-title">Lade...</h2>
        </div>
        <div class="controls">
            <button class="btn btn-hist" onclick="App.prevSeason()" title="Vorherige Saison">&lt;&lt;</button>
            <button class="btn btn-hist" onclick="App.prevMatchday()" title="Vorheriger Spieltag">&lt;</button>
            <span id="season-info" style="font-weight:bold;">Saison 2025/26</span>
            <button class="btn btn-hist" onclick="App.nextMatchday()" title="Nächster Spieltag">&gt;</button>
            <button class="btn btn-hist" onclick="App.nextSeasonView()" title="Nächste Saison">&gt;&gt;</button>
            <div style="width:1px; height:20px; background:#444; margin:0 10px;"></div>
            <span id="version-display" style="font-size:11px; opacity:0.4; margin-right:4px;"></span>
            <button class="btn btn-info" onclick="App.showChangelog()">📋 Changelog</button>
            <button class="btn btn-info" onclick="App.showRules()">ℹ️ Regeln</button>
            <button class="btn btn-info" id="btn-theme" onclick="App.toggleTheme()" title="Hell/Dunkel">☀️</button>
            <button id="btn-play" class="btn" onclick="App.nextStep()">Woche</button>
            <button id="btn-sim" class="btn" onclick="App.simRest()">Simulieren</button>
            <button id="btn-finish" class="btn" onclick="App.showSeasonEnd()">Abschluss</button>
            <button id="btn-mega" class="btn" style="background:#6a1b9a;" onclick="App.megaSim()">⚡ Multi-Saison</button>
            <button class="btn btn-info" onclick="App.showDebugLog()">🔍 Log</button>
            <button class="btn" style="background:#d32f2f;" onclick="App.reset()">Reset</button>
        </div>
    </header>
    <div id="content"></div>
    <div id="save-bar">
        <div class="save-action-grid">
            <button onclick="App.exportGameState()" class="btn" style="background:#10b981;">💾 Exportieren</button>
            <button onclick="document.getElementById('importFileInput').click()" class="btn" style="background:#a855f7;">📂 Importieren</button>
            <button onclick="App.quickSave()" class="btn" style="background:#f59e0b;color:#000;">⚡ Quick-Save</button>
            <button onclick="App.restoreAutoSave()" class="btn" style="background:#ea580c;">↩️ Auto-Save</button>
            <button onclick="App.openResetCenter()" class="btn" style="background:#dc2626;">🔧 Reset-Center</button>
            <button onclick="App.openDatasetManager()" class="btn" style="background:#64748b;">📂 Datensätze</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="App.importGameState(event)">
        <div id="saveStatus"></div>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-title">Info</span>
            <button class="btn" onclick="document.getElementById('modal').style.display='none'">Schließen</button>
        </div>
        <div class="tabs" id="modal-tabs" style="display:none;">
            <div class="tab active" onclick="App.switchTab('rele')">Relegation</div>
            <div class="tab" onclick="App.switchTab('log')">Transfers</div>
            <div class="tab" onclick="App.switchTab('stats')">Ligagrößen</div>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script src="game_data.js"></script>
<script src="game_engine.js"></script>
<script>
    const VERSION = '0.3.74';
</script>
<script src="app/dfb_logo.js"></script>
<script src="app/core.js"></script>
<script src="app/pokal.js"></script>
<script src="app/league.js"></script>
<script src="app/modal.js"></script>
<script src="app/save_manager.js"></script>
</script>
</body>
</html>
